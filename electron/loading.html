<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>A-Eyes 起動中...</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050816;
        color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        text-align: center;
      }

      .spinner {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        border: 4px solid rgba(156, 163, 175, 0.4);
        border-top-color: #38bdf8;
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem auto;
      }

      .title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        font-size: 0.875rem;
        color: #9ca3af;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="title">A-Eyes を起動しています...</div>
      <div class="subtitle">初期化には数十秒かかることがあります。</div>
    </div>
  </body>
</html>
