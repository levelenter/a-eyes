[package]
name = "a-eyes"
version = "0.1.0"
description = "A-Eyes - AI Assistant for Visually Impaired Users"
authors = ["Levelenter"]
edition = "2021"

[lib]
name = "a_eyes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "a-eyes"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-store = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
